[project]
name = "deep-learning"
version = "0.1.0"
description = "CENG506 Deep Learning coursework: neural network, U-Net segmentation and RNN notebooks"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Mehmet Arda Aksoydan" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "h5py>=3.9",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "tensorflow>=2.16",
    "jupyterlab>=4.0",
    "ipykernel>=6.25",
]

[tool.uv]
package = false
